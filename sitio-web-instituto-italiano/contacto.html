    <main>
        <section>
            <h1>Contacto</h1>
            <form>                
                <label for="usuario">Nombre</label>
                <input type="text" id="usuario" name="usuario" placeholder="Nombre" required>
                <label for="mail">Email</label>      
                <input type="email" id="mail" name="mail" placeholder="Email" required>
                <label for="celu">Celular</label>
                <input type="tel" id="celu" name="celu" placeholder="Celular" required>
                <label for="curso">Curso de interes</label>
                <input type="text" id="curso" name="curso" placeholder="Curso de interes" required>
                <label for="localidad">Localidad</label>
                <input type="text" id="localidad" name="localidad" placeholder="Zona de residencia">
                <label for="consulta">Consulta o Comentarios</label>
                <textarea id="consulta" name="consulta" placeholder="Consulta"></textarea>
                <input type="submit" value="Enviar">       
            </form> 
        </section>
    </main>
